name: CI & Security

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  governance-changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Enforce changelog update policy
        run: bash .github/scripts/require_changelog.sh

  security-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql-analysis:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'actions']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d  # v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d  # v3
        with:
          category: "/language:${{ matrix.language }}"

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install Shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint workflow files
        run: |
          pip install "actionlint-py==1.7.12.25" "shellcheck-py==0.11.0.1"
          actionlint .github/workflows/*.yml
      - name: Check bash syntax and lint
        run: |
          bash -n scripts/*.sh vm/*.sh dev-lab/*.sh demo/*.sh scenarios/run.sh
          shellcheck scripts/*.sh vm/*.sh dev-lab/*.sh demo/*.sh scenarios/run.sh

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install Ruff & Pytest
        run: pip install ruff pytest
      - name: Run Ruff Linter & Formatter
        run: |
          ruff check .
          ruff format --check .

  test-and-verify:
    name: Automated Security, MCP & Operational Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install "pytest==8.4.2" "pytest-cov==6.2.1" "PyYAML==6.0.2"
      - name: Run test suite with reproducible JUnit & coverage reports
        run: |
          python3 -m pytest -v --junitxml=test-results.xml
      - name: Upload reproducible test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: test-results-and-evidence
          path: test-results.xml

  e2e-incident-demo:
    name: End-to-end incident demo (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEMO_CONTEXT: kind-pd-e2e
      DEMO_CONFIRM: kind-pd-e2e/production-debug-lab
      DEMO_IMAGE: production-debug:ci
      DEMO_OUTPUT: ${{ github.workspace }}/incident-output
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Build diagnostic image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          tags: production-debug:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1
        with:
          cluster_name: pd-e2e

      - name: Load image into kind
        run: kind load docker-image production-debug:ci --name pd-e2e

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install MCP client
        run: |
          python -m venv demo/.venv
          demo/.venv/bin/pip install -r demo/requirements.txt

      - name: Run demo (break, isolate, prove, collect, investigate, remediate, verify, clean up)
        run: bash demo/run.sh run

      - name: Cleanup is idempotent
        run: bash demo/run.sh cleanup

      - name: Upload incident archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: incident-archive
          path: incident-output
          if-no-files-found: ignore
