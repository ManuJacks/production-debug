name: KPI Publish

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  kpi-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Collect KPI metrics from telemetry fixtures
        run: |
          bash scripts/kpi_collect.sh telemetry/ --format csv > kpi.csv
          bash scripts/kpi_collect.sh telemetry/ --format json > kpi-records.json

      - name: Generate KPI summary report
        run: |
          bash scripts/kpi_report.sh telemetry/ > kpi-report.txt
          bash scripts/kpi_report.sh telemetry/ --format json > kpi-summary.json

      - name: Generate KPI delta report (baseline vs current)
        run: |
          if [[ -d telemetry/baseline ]]; then
            bash scripts/kpi_compare.sh telemetry/baseline telemetry/ > kpi-delta.txt
            bash scripts/kpi_compare.sh telemetry/baseline telemetry/ --format json > kpi-delta.json
          else
            echo "No telemetry/baseline directory found; skipping baseline delta report." > kpi-delta.txt
            printf '{"note":"no baseline directory"}\n' > kpi-delta.json
          fi

      - name: Post KPI summary to job summary
        run: |
          echo "## Platform KPI Report $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat kpi-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### KPI Baseline Delta" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat kpi-delta.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate release-trust checksums for KPI artifacts
        run: |
          sha256sum kpi.csv kpi-records.json kpi-report.txt kpi-summary.json kpi-delta.txt kpi-delta.json > kpi-artifacts.sha256

      - name: Check success rate against target
        run: |
          python3 - <<'PY'
          import json, sys

          with open("kpi-summary.json") as f:
              report = json.load(f)

          rate = report.get("success_rate_pct", 0.0)
          target = 95.0
          print(f"success_rate_pct={rate} (target>={target})")
          if rate < target:
              print(f"WARNING: success rate {rate}% is below target {target}%", file=sys.stderr)
              sys.exit(1)
          PY
        continue-on-error: true

      - name: Upload KPI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kpi-report-${{ github.run_number }}
          path: |
            kpi.csv
            kpi-records.json
            kpi-report.txt
            kpi-summary.json
            kpi-delta.txt
            kpi-delta.json
            kpi-artifacts.sha256
