# Least-privilege RBAC for the production-debug pod, in three layers.
#
#   Layer 1  prod-debug-cluster-reader  nodes, namespaces      standing (ClusterRoleBinding)
#   Layer 2  prod-debug-reader          workload metadata      per incident, per namespace
#   Layer 3  prod-debug-log-reader      pods/log               per incident, explicit --logs
#
# Layers 2 and 3 grant nothing until bound with a RoleBinding in one incident
# namespace, and only namespaces named in the environment's allowlist
# (access/<env>.namespaces) may be granted:
#
#   scripts/grant-incident-access.sh --env lab grant app-team-a [--logs]
#   scripts/grant-incident-access.sh revoke app-team-a
#
# A ClusterRole bound by a RoleBinding grants its rules in that one namespace
# only. Logs are separate because they can contain credentials, tokens and
# personal data. Secrets and ConfigMaps are never granted, and there are no
# write verbs, no pods/exec, pods/attach, pods/portforward or pods/proxy.
apiVersion: v1
kind: Namespace
metadata:
  name: debug-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prod-debug-sa
  namespace: debug-system
  annotations:
    # Azure Workload Identity annotation for zero-secret auth
    azure.workload.identity/client-id: "PLACEHOLDER_AZURE_CLIENT_ID"
---
# Layer 2: workload metadata. Grants nothing until bound with a RoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prod-debug-reader
rules:
- apiGroups: [""]
  resources: ["pods", "events", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch"]
---
# Layer 3: container logs. Bound separately and only on request (--logs).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prod-debug-log-reader
rules:
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
# Layer 1: cluster-scoped objects only; these have no namespace to bind into.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prod-debug-cluster-reader
rules:
- apiGroups: [""]
  resources: ["nodes", "namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prod-debug-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prod-debug-cluster-reader
subjects:
- kind: ServiceAccount
  name: prod-debug-sa
  namespace: debug-system
