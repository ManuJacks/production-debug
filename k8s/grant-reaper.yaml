# prod-debug-grant-reaper: deletes production-debug grants after their
# production-debug/expires-at time (ADR-SEC-001 section 7, item 2).
#
# Least privilege: it may list RoleBindings and delete only RoleBindings named
# prod-debug-reader or prod-debug-log-reader. It can only take access away.
# The ConfigMap embeds scripts/reap-expired-grants.sh; a test keeps them equal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prod-debug-grant-reaper
  namespace: debug-system
  labels:
    app.kubernetes.io/part-of: production-debug-toolkit
    app.kubernetes.io/component: grant-reaper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prod-debug-grant-reaper
  labels:
    app.kubernetes.io/part-of: production-debug-toolkit
    app.kubernetes.io/component: grant-reaper
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["prod-debug-reader", "prod-debug-log-reader"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prod-debug-grant-reaper
  labels:
    app.kubernetes.io/part-of: production-debug-toolkit
    app.kubernetes.io/component: grant-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prod-debug-grant-reaper
subjects:
  - kind: ServiceAccount
    name: prod-debug-grant-reaper
    namespace: debug-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prod-debug-grant-reaper
  namespace: debug-system
  labels:
    app.kubernetes.io/part-of: production-debug-toolkit
    app.kubernetes.io/component: grant-reaper
data:
  reap-expired-grants.sh: |
    #!/usr/bin/env bash
    # reap-expired-grants.sh: delete production-debug grants that have expired.
    #
    #   scripts/reap-expired-grants.sh [--dry-run]
    #
    # Looks at every RoleBinding to prod-debug-reader or prod-debug-log-reader in
    # the cluster. Deletes it when its production-debug/expires-at annotation has
    # passed, or when it has no valid expiry (made before expiry existed, or by
    # hand around the admission guard): fail closed.
    #
    # Runs every 5 minutes in-cluster as the prod-debug-grant-reaper CronJob
    # (k8s/grant-reaper.yaml, which embeds a copy of this file), and by hand with
    # operator credentials. ADR-SEC-001 section 7, item 2.
    # Exit codes: 0 ok, 1 a grant could not be removed, 2 misuse.
    set -euo pipefail

    EXPIRES_ANNOTATION="production-debug/expires-at"
    ROLES=" prod-debug-reader prod-debug-log-reader "
    # The reaper's RBAC can delete only bindings with these names.
    NAMES=" prod-debug-reader prod-debug-log-reader "

    dry_run=no
    case "${1:-}" in
        "") ;;
        --dry-run) dry_run=yes ;;
        *)
            echo "usage: $0 [--dry-run]" >&2
            exit 2
            ;;
    esac

    now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    # Read the list first, so a failed API call fails the run instead of looking
    # like "nothing to do".
    list="$(kubectl get rolebindings --all-namespaces -o go-template="$(printf '%s' \
        '{{range .items}}{{if eq .roleRef.kind "ClusterRole"}}' \
        '{{.metadata.namespace}}{{"\t"}}{{.metadata.name}}{{"\t"}}{{.roleRef.name}}{{"\t"}}' \
        "{{with .metadata.annotations}}{{index . \"$EXPIRES_ANNOTATION\"}}{{end}}" \
        '{{"\n"}}{{end}}{{end}}')")"

    kept=0 reaped=0 failed=0
    while IFS=$'\t' read -r ns name role expires; do
        [ -n "$ns" ] || continue
        [[ "$ROLES" == *" $role "* ]] || continue
        if [[ "$expires" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            # Same fixed format on both sides, so string order is time order.
            if [[ "$expires" > "$now" ]]; then
                kept=$((kept + 1))
                continue
            fi
            reason="expired at $expires"
        else
            reason="no valid $EXPIRES_ANNOTATION"
        fi
        if [[ "$NAMES" != *" $name "* ]]; then
            echo "cannot reap $ns/$name ($role, $reason): not a name the reaper may delete; revoke it by hand" >&2
            failed=1
            continue
        fi
        if [ "$dry_run" = yes ]; then
            echo "would reap $ns/$name ($role): $reason"
        elif kubectl delete rolebinding "$name" -n "$ns" --wait=false >/dev/null; then
            echo "reaped $ns/$name ($role): $reason"
        else
            echo "failed to reap $ns/$name ($role): $reason" >&2
            failed=1
            continue
        fi
        reaped=$((reaped + 1))
    done <<<"$list"

    echo "summary at $now: kept=$kept reaped=$reaped dry_run=$dry_run"
    exit "$failed"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prod-debug-grant-reaper
  namespace: debug-system
  labels:
    app.kubernetes.io/part-of: production-debug-toolkit
    app.kubernetes.io/component: grant-reaper
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 240
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: production-debug-grant-reaper
            app.kubernetes.io/part-of: production-debug-toolkit
            app.kubernetes.io/component: grant-reaper
        spec:
          serviceAccountName: prod-debug-grant-reaper
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reaper
              image: ghcr.io/manujacks/production-debug:0.2.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/opt/reaper/reap-expired-grants.sh"]
              env:
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /opt/reaper
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: prod-debug-grant-reaper
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
