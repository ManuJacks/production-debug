apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: production-debug-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: production-debug
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
