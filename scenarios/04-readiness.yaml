apiVersion: apps/v1
kind: Deployment
metadata: {name: readiness-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: readiness-demo}}
  template:
    metadata: {labels: {app: readiness-demo}}
    spec:
      containers:
        - name: app
          image: nginx:1.27
          readinessProbe: {httpGet: {path: /missing, port: 80}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: readiness-demo}
spec: {selector: {app: readiness-demo}, ports: [{port: 80, targetPort: 80}]}
