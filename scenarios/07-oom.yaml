apiVersion: apps/v1
kind: Deployment
metadata: {name: oom-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: oom-demo}}
  template:
    metadata: {labels: {app: oom-demo}}
    spec:
      containers:
        - name: allocator
          image: polinux/stress:1.0.4
          args: ["--vm", "1", "--vm-bytes", "128M", "--vm-hang", "1"]
          resources: {limits: {memory: 32Mi}, requests: {memory: 16Mi}}
